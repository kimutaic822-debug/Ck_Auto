name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore ckauto.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ckauto -storepass ckauto2026 -keypass ckauto2026 \
            -dname "CN=CK Auto, OU=Mobile, O=CK Auto, L= Nairobi, ST=Nairobi, C=KE"
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CK-Auto-APK
          path: app/build/outputs/apk/release/app-release.apk
