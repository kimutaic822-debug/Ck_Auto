name: Build CK Auto APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compile APK

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Override MainActivity to Request All Permissions
        run: |
          cat > android/app/src/main/java/com/ckauto/app/MainActivity.java << 'JAVA_EOF'
          package com.ckauto.app;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private static final int PERMISSION_REQUEST_CODE = 101;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestAllRuntimePermissions();
                  requestBatteryOptimizationExemption();
              }

              private void requestAllRuntimePermissions() {
                  List<String> permissions = new ArrayList<>();

                  // SMS
                  permissions.add(Manifest.permission.READ_SMS);
                  permissions.add(Manifest.permission.SEND_SMS);
                  permissions.add(Manifest.permission.RECEIVE_SMS);
                  permissions.add(Manifest.permission.RECEIVE_MMS);
                  permissions.add(Manifest.permission.RECEIVE_WAP_PUSH);

                  // Phone
                  permissions.add(Manifest.permission.CALL_PHONE);
                  permissions.add(Manifest.permission.READ_PHONE_STATE);
                  permissions.add(Manifest.permission.READ_PHONE_NUMBERS);
                  permissions.add(Manifest.permission.ANSWER_PHONE_CALLS);

                  // Contacts
                  permissions.add(Manifest.permission.READ_CONTACTS);
                  permissions.add(Manifest.permission.WRITE_CONTACTS);
                  permissions.add(Manifest.permission.GET_ACCOUNTS);

                  // Storage (Android 12 and below)
                  if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.S_V2) {
                      permissions.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                      permissions.add(Manifest.permission.WRITE_EXTERNAL_STORAGE);
                  }

                  // Media + Notifications (Android 13+)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissions.add(Manifest.permission.POST_NOTIFICATIONS);
                      permissions.add(Manifest.permission.READ_MEDIA_IMAGES);
                      permissions.add(Manifest.permission.READ_MEDIA_VIDEO);
                      permissions.add(Manifest.permission.READ_MEDIA_AUDIO);
                  }

                  // Camera
                  permissions.add(Manifest.permission.CAMERA);

                  // Audio
                  permissions.add(Manifest.permission.MODIFY_AUDIO_SETTINGS);

                  List<String> toRequest = new ArrayList<>();
                  for (String p : permissions) {
                      if (ContextCompat.checkSelfPermission(MainActivity.this, p) != PackageManager.PERMISSION_GRANTED) {
                          toRequest.add(p);
                      }
                  }

                  if (!toRequest.isEmpty()) {
                      ActivityCompat.requestPermissions(MainActivity.this,
                          toRequest.toArray(new String[0]), PERMISSION_REQUEST_CODE);
                  }
              }

              private void requestBatteryOptimizationExemption() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          try {
                              Intent intent = new Intent();
                              intent.setAction(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                              intent.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(intent);
                          } catch (Exception e) { }
                      }
                  }
              }
          }
          JAVA_EOF

      - name: Inject Accessibility Service Kotlin File
        run: |
          mkdir -p android/app/src/main/java/com/ckauto/app
          cat > android/app/src/main/java/com/ckauto/app/CKAutoAccessibilityService.kt << 'KOTLIN_EOF'
          package com.ckauto.app

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class CKAutoAccessibilityService : AccessibilityService() {
              companion object {
                  var instance: CKAutoAccessibilityService? = null
                  var lastUSSDText: String = ""
              }

              override fun onServiceConnected() {
                  instance = this
                  lastUSSDText = ""
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent) {
                  if (event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED &&
                      event.eventType != AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED) return
                  val root = rootInActiveWindow ?: return
                  val text = collectText(root)
                  if (text.contains("M-PESA") || text.contains("Select") || text.contains("Enter") || text.contains("Confirm")) {
                      lastUSSDText = text
                  }
              }

              fun inputText(text: String) {
                  val root = rootInActiveWindow ?: return
                  val editField = findEditText(root) ?: return
                  val args = android.os.Bundle()
                  args.putString(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  editField.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
              }

              fun clickByKeyword(keyword: String): Boolean {
                  val root = rootInActiveWindow ?: return false
                  val node = findByText(root, keyword) ?: return false
                  return node.performAction(AccessibilityNodeInfo.ACTION_CLICK)
              }

              fun getScreenText(): String {
                  val root = rootInActiveWindow ?: return ""
                  return collectText(root)
              }

              private fun collectText(node: AccessibilityNodeInfo): String {
                  val sb = StringBuilder()
                  node.text?.let { sb.append(it).append("\n") }
                  for (i in 0 until node.childCount) {
                      node.getChild(i)?.let { sb.append(collectText(it)) }
                  }
                  return sb.toString()
              }

              private fun findEditText(node: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  if (node.className == "android.widget.EditText") return node
                  for (i in 0 until node.childCount) {
                      val found = node.getChild(i)?.let { findEditText(it) }
                      if (found != null) return found
                  }
                  return null
              }

              private fun findByText(node: AccessibilityNodeInfo, keyword: String): AccessibilityNodeInfo? {
                  val t = node.text?.toString()?.lowercase() ?: ""
                  if (t.contains(keyword.lowercase())) return node
                  for (i in 0 until node.childCount) {
                      val found = node.getChild(i)?.let { findByText(it, keyword) }
                      if (found != null) return found
                  }
                  return null
              }

              override fun onInterrupt() {}
          }
          KOTLIN_EOF

      - name: Create Accessibility Config XML
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/accessibility_service_config.xml << 'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/accessibility_description" />
          XML_EOF

      - name: Add Accessibility Description String
        run: |
          python3 - << 'PY_EOF'
          import os
          path = "android/app/src/main/res/values/strings.xml"
          os.makedirs(os.path.dirname(path), exist_ok=True)
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()
          else:
              content = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>'
          if 'accessibility_description' not in content:
              content = content.replace("</resources>", '    <string name="accessibility_description">CK Auto reads USSD menus to complete data sales and M-Pesa transactions silently.</string>\n</resources>')
          with open(path, "w") as f:
              f.write(content)
          PY_EOF

      - name: Inject Service into AndroidManifest.xml
        run: |
          python3 - << 'PY_EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          service_block = '''
              <service
                  android:name=".CKAutoAccessibilityService"
                  android:exported="true"
                  android:label="CK Auto Automation"
                  android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                  <intent-filter>
                      <action android:name="android.accessibilityservice.AccessibilityService" />
                  </intent-filter>
                  <meta-data
                      android:name="android.accessibilityservice"
                      android:resource="@xml/accessibility_service_config" />
              </service>
          '''
          content = content.replace("</application>", service_block + "\n    </application>")
          with open(path, "w") as f:
              f.write(content)
          print("Accessibility Service injected")
          PY_EOF

      - name: Add Required Permissions to Manifest
        run: |
          python3 - << 'PY_EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          perms = '''    <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_MMS" />
              <uses-permission android:name="android.permission.RECEIVE_WAP_PUSH" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_PHONE_NUMBERS" />
              <uses-permission android:name="android.permission.ANSWER_PHONE_CALLS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_CONTACTS" />
              <uses-permission android:name="android.permission.GET_ACCOUNTS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
          '''
          content = content.replace("<application", perms + "\n    <application")
          with open(path, "w") as f:
              f.write(content)
          print("All permissions added")
          PY_EOF

      - name: Sync Web Assets and Plugins
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CK-Auto-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
