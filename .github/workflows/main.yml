name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip project
        id: proj
        run: |
          ZIP=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          echo "Using $ZIP"
          rm -rf android && mkdir android
          unzip -o -q "$ZIP" -d android
          ROOT=$(dirname "$(find android -name settings.gradle.kts | head -1)")
          echo "Project root: $ROOT"
          ls "$ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleRelease --no-daemon
        working-directory: ${{ steps.proj.outputs.root }}
      - uses: actions/upload-artifact@v4
        with:
          name: CK-Auto-APK
          path: ${{ steps.proj.outputs.root }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
